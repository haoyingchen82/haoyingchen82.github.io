bio: |
  I am currently studying how recent multimodal models acquire, represent, and use 3D spatial information, with a particular focus on improving their 3D awareness for spatial reasoning. I am motivated by the view that robust spatial intelligence is an important component of more general intelligent systems, enabling models to reason more effectively from visual observations and supporting future embodied intelligence.

  I approach these questions with strong curiosity, enthusiasm, and a highly self-driven learning mindset.
interests:
