# Personal content lives in data/authors/me.yaml.
# Thin local helpers derive branding and homepage SEO from that source.
hugoblox:
  schema: "2.0"
  identity:
    name: ""
    organization: ""
    type: person
    tagline: ""
    description: ""
    social: {}
  theme:
    mode: system
    pack: default
    colors:
      primary: "#46647b"
      secondary: "#64748b"
      neutral: slate
    surfaces:
      background: "#fcfcfb"
      foreground: "#24313b"
  typography:
    pack: academic
  layout:
    radius: sm
    spacing: comfortable
  header:
    enable: true
    style: navbar
    sticky: true
    align: right
    search: false
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
  footer:
    style: minimal
    language_switcher: false
    text: ""
  copyright:
    notice: "© {year} {name}."
  seo:
    title: ""
    ai:
      allow: [/]
      disallow: []
      note: ""
      contact: ""
  content:
    math:
      enable: false
    toc:
      enable: false
    reading_time:
      enable: false
    citations:
      style: apa
  search:
    enable: false
  comments:
    enable: false
  analytics: {}
  verification: {}
  repository:
    enable: false
  locale:
    date_format: Jan 2006
    time_format: "3:04 PM"
    address_format: en-us
  privacy:
    enable: false
  debug:
    enable: false
    export_logs: false
  pro:
    hide_attribution: false
